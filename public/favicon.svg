<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Navy circle background -->
  <circle cx="100" cy="100" r="100" fill="#1a1f3a"/>

  <!-- Bird silhouette in gold -->
  <defs>
    <linearGradient id="faviconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8972a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main body -->
  <ellipse cx="100" cy="100" rx="20" ry="25" fill="url(#faviconGold)"/>

  <!-- Head -->
  <circle cx="112" cy="88" r="13" fill="url(#faviconGold)"/>

  <!-- Beak -->
  <path d="M 123 88 L 135 86 L 123 90 Z" fill="url(#faviconGold)"/>

  <!-- Left wing -->
  <path d="M 85 98 Q 60 80 50 92 Q 55 105 75 108 Q 85 107 85 102" fill="url(#faviconGold)" opacity="0.95"/>

  <!-- Right wing -->
  <path d="M 115 98 Q 140 80 150 92 Q 145 105 125 108 Q 115 107 115 102" fill="url(#faviconGold)" opacity="0.95"/>

  <!-- Tail feathers -->
  <path d="M 80 120 Q 72 135 68 145 L 76 141 Q 83 130 88 120 Z" fill="url(#faviconGold)" opacity="0.9"/>
  <path d="M 100 125 Q 100 140 96 150 L 104 144 Q 108 133 104 125 Z" fill="url(#faviconGold)" opacity="0.9"/>
  <path d="M 120 120 Q 128 135 132 145 L 124 141 Q 117 130 112 120 Z" fill="url(#faviconGold)" opacity="0.9"/>

  <!-- Eye -->
  <circle cx="120" cy="85" r="2.5" fill="#1a1f3a"/>
</svg>
