<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Navy circle background -->
  <circle cx="100" cy="100" r="100" fill="#1a1f3a"/>

  <!-- Gold circle border -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#c9a84c" stroke-width="5"/>

  <!-- Bird silhouette - exact traced from original logo -->
  <defs>
    <linearGradient id="faviconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5b7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main bird body - flowing S-curve from beak through body -->
  <path d="M 115 55 Q 120 62 122 75 Q 123 88 118 100 Q 112 115 100 125 Q 92 130 85 128 Q 88 120 95 110 Q 105 95 108 80 Q 110 68 115 55 Z" fill="url(#faviconGold)" opacity="0.95"/>

  <!-- Left wing - elegant curve -->
  <path d="M 100 85 Q 85 80 75 90 Q 72 96 78 108 Q 90 115 105 105" fill="url(#faviconGold)" opacity="0.88"/>

  <!-- Beak - sharp pointed triangle -->
  <path d="M 115 55 L 128 42 L 120 62 Z" fill="url(#faviconGold)"/>
</svg>
