<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Navy circle background -->
  <circle cx="100" cy="100" r="100" fill="#1a1f3a"/>

  <!-- Gold circle border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#c9a84c" stroke-width="4" opacity="0.8"/>

  <!-- Bird silhouette - exact design from logo -->
  <defs>
    <linearGradient id="faviconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5b7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main bird body and wing - single flowing shape -->
  <path d="M 95 145 Q 90 130 88 115 Q 86 100 95 85 Q 105 70 115 65 Q 125 62 130 58 L 128 62 Q 118 68 110 78 Q 102 88 105 105 Q 108 125 100 140 Z" fill="url(#faviconGold)"/>

  <!-- Upper wing curve -->
  <path d="M 110 80 Q 95 75 85 85 Q 80 92 85 105 Q 100 110 115 105" fill="url(#faviconGold)" opacity="0.9"/>

  <!-- Beak -->
  <path d="M 130 58 L 140 50 L 132 62 Z" fill="url(#faviconGold)"/>
</svg>
