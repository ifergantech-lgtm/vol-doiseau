<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Bird in flight silhouette -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8972a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main body -->
  <ellipse cx="100" cy="100" rx="28" ry="35" fill="url(#goldGradient)"/>

  <!-- Head -->
  <circle cx="115" cy="85" r="18" fill="url(#goldGradient)"/>

  <!-- Beak -->
  <path d="M 130 85 L 145 82 L 130 88 Z" fill="url(#goldGradient)"/>

  <!-- Left wing (open position) -->
  <path d="M 85 95 Q 50 70 35 85 Q 40 100 60 105 Q 80 105 85 100" fill="url(#goldGradient)" opacity="0.95"/>

  <!-- Right wing (open position) -->
  <path d="M 115 95 Q 150 70 165 85 Q 160 100 140 105 Q 120 105 115 100" fill="url(#goldGradient)" opacity="0.95"/>

  <!-- Tail feathers -->
  <path d="M 80 125 Q 70 145 65 160 L 75 155 Q 85 140 90 125 Z" fill="url(#goldGradient)" opacity="0.9"/>
  <path d="M 100 130 Q 100 150 95 165 L 105 158 Q 110 140 105 130 Z" fill="url(#goldGradient)" opacity="0.9"/>
  <path d="M 120 125 Q 130 145 135 160 L 125 155 Q 115 140 110 125 Z" fill="url(#goldGradient)" opacity="0.9"/>

  <!-- Eye -->
  <circle cx="125" cy="82" r="3" fill="#1a1f3a"/>
</svg>
